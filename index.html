<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fire data pack</title>
    <link rel="icon" type="image/svg+xml" href="assets/main/textures/favicon.svg" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0806;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(180, 60, 0, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(220, 80, 0, 0.15) 0%, transparent 50%);
            padding: 20px;
        }

        .container {
            max-width: 620px;
            width: 100%;
            animation: fadeUp 0.8s ease-out both;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .main-title {
            text-align: center;
            font-size: clamp(2.8rem, 10vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #ff9a3c, #ff5e00, #ff2a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .title-icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            flex-shrink: 0;
        }

        .title-underline {
            width: 70px;
            height: 3px;
            margin: 12px auto 30px auto;
            background: linear-gradient(90deg, transparent, #ff6a00, transparent);
            border-radius: 4px;
            opacity: 0.6;
        }

        /* 项目卡片 – 默认隐藏，由 JS 控制显示 */
        .project-card {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 140, 40, 0.15);
            border-radius: 24px;
            padding: 30px 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .project-card.visible {
            display: block;
        }

        .project-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .project-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: rgba(255, 120, 20, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 140, 40, 0.1);
            padding: 8px;
        }

        .project-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .project-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0e6d8;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 600;
            background: rgba(255, 140, 40, 0.15);
            color: #ffb074;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 140, 40, 0.1);
            text-transform: uppercase;
        }

        .project-note {
            margin-top: 6px;
            font-size: 0.95rem;
            color: #b8a89a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .note-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .note-text {
            background: rgba(255, 200, 100, 0.05);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 200, 100, 0.06);
            font-size: 0.85rem;
            color: #d4c0b0;
        }

        .version-tag {
            background: rgba(255, 100, 50, 0.12);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #ffb074;
            border: 1px solid rgba(255, 100, 50, 0.1);
        }

        .divider {
            margin: 18px 0 22px 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 40, 0.12), transparent);
        }

        .download-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .download-info {
            font-size: 0.85rem;
            color: #8a7a6a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-info .info-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .download-info .info-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .file-size {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #9a8a7a;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff7a2a, #f05000);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(255, 80, 0, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }

        .download-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 40px rgba(255, 80, 0, 0.5);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .download-btn .btn-icon {
            width: 1.2rem;
            height: 1.2rem;
            display: inline-block;
        }

        .download-btn .btn-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.25s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .modal-box {
            background: rgba(20, 14, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 140, 40, 0.2);
            border-radius: 28px;
            padding: 32px 30px 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f0e6d8;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }

        .version-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .version-list::-webkit-scrollbar {
            width: 4px;
        }
        .version-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .version-list::-webkit-scrollbar-thumb {
            background: rgba(255, 140, 40, 0.3);
            border-radius: 10px;
        }

        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s, border-color 0.2s;
        }

        .version-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 140, 40, 0.15);
        }

        .version-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .version-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .version-number {
            font-size: 1rem;
            font-weight: 600;
            color: #e8ddd0;
            letter-spacing: 0.01em;
        }

        .version-download {
            width: 32px;
            height: 32px;
            padding: 4px;
            border-radius: 50%;
            background: rgba(255, 120, 20, 0.12);
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .version-download:hover {
            background: rgba(255, 120, 20, 0.25);
            transform: scale(1.08);
        }

        .version-download:active {
            transform: scale(0.92);
        }

        .version-download img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .modal-close {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #b8a89a;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f0e6d8;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 200, 160, 0.08);
            letter-spacing: 0.06em;
        }

        /* 空状态提示（0 个文件可下载） */
        .empty-state {
            text-align: center;
            padding: 16px 0 8px 0;
            color: #b8a89a;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .empty-state .empty-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state .empty-text {
            color: #8a7a6a;
        }

        @media (max-width: 500px) {
            .project-card { padding: 20px 18px; }
            .project-name { font-size: 1.25rem; }
            .download-area { flex-direction: column; align-items: stretch; }
            .download-btn { width: 100%; justify-content: center; }
            .download-info { justify-content: center; }
            .modal-box { padding: 24px 18px; }
            .version-item { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">
            <img src="assets/main/textures/fire.svg" alt="Fire" class="title-icon" />
            <span>fire data pack</span>
        </h1>
        <div class="title-underline"></div>

        <!-- 项目卡片 – 默认隐藏，由 JS 控制显示 -->
        <div class="project-card" id="projectCard">
            <!-- 正常状态（有文件可下载） -->
            <div id="normalContent">
                <div class="project-header">
                    <div class="project-icon">
                        <img src="assets/main/textures/package.svg" alt="Package" />
                    </div>
                    <div class="project-name">
                        <span id="projectName">neovillage.zip</span>
                        <span class="badge" id="versionBadge">Alpha</span>
                    </div>
                </div>
                <div class="project-note">
                    <span class="note-icon">
                        <img src="assets/main/textures/pin.svg" alt="Pin" />
                    </span>
                    <span class="note-text" id="projectNote">bug fix</span>
                    <span class="version-tag" id="verlevelTag">等级 3</span>
                </div>

                <div class="divider"></div>

                <div class="download-area">
                    <div class="download-info">
                        <span class="info-icon">
                            <img src="assets/main/textures/clip.svg" alt="Clip" />
                        </span>
                        <span>Data Pack</span>
                        <span class="file-size">~1.2 MB</span>
                    </div>
                    <button class="download-btn" id="openModalBtn">
                        <span class="btn-icon">
                            <img src="assets/main/textures/download.svg" alt="Download" />
                        </span>
                        Download
                    </button>
                </div>
            </div>

            <!-- 空状态（0 个文件可下载） -->
            <div id="emptyContent" style="display: none;">
                <div class="empty-state">
                    <span class="empty-icon">📂</span>
                    <span class="empty-text">Looks like the files aren't installed yet...</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>✦  Made with 🔥  ·  MC Data Pack  ✦</span>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="versionModal">
        <div class="modal-box">
            <div class="modal-title">
                <span style="color:#ff7a00;">📦</span> Select Version
            </div>
            <div class="version-list" id="versionList">
                <!-- 动态生成 -->
            </div>
            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ========== 配置 ==========
            const JSON_PATH = 'data/main/file/neovillage.json';
            const DOWNLOAD_BASE = 'assets/main/download/';
            const ICON_VERSION = 'assets/main/textures/version.svg';
            const ICON_DOWNLOAD = 'assets/main/textures/download.svg';

            // ========== DOM 引用 ==========
            const projectCard = document.getElementById('projectCard');
            const normalContent = document.getElementById('normalContent');
            const emptyContent = document.getElementById('emptyContent');
            const projectName = document.getElementById('projectName');
            const versionBadge = document.getElementById('versionBadge');
            const projectNote = document.getElementById('projectNote');
            const verlevelTag = document.getElementById('verlevelTag');
            const versionList = document.getElementById('versionList');
            const openModalBtn = document.getElementById('openModalBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalOverlay = document.getElementById('versionModal');

            // ========== 辅助函数 ==========
            function getVersionType(value) {
                const map = {
                    1: 'Alpha',
                    2: 'Beta',
                    3: 'Stable Beta',
                    4: 'Official'
                };
                return map[value] || 'Unknown';
            }

            // 检测文件是否存在（使用 HEAD 请求）
            function fileExists(url) {
                return fetch(url, { method: 'HEAD' })
                    .then(res => res.ok)
                    .catch(() => false);
            }

            // 显示模态框
            function openModal() {
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // ========== 主逻辑 ==========
            async function init() {
                try {
                    // 1. 加载 JSON
                    const response = await fetch(JSON_PATH);
                    if (!response.ok) {
                        // JSON 不存在或无法读取 → 完全忽略，不显示任何内容
                        return;
                    }
                    const data = await response.json();

                    // 2. 校验 check_code（1 或 48 才有效）
                    if (data.check_code !== 1 && data.check_code !== 48) {
                        // 无效校验码 → 忽略
                        return;
                    }

                    // 3. 解析数据
                    const name = data.name || 'neovillage.zip';
                    const versionType = getVersionType(data.version);
                    const note = data.note || '';
                    const verlevel = data.verlevel || 0;
                    const fileMap = data.file || {};
                    const minecraftVersions = data.minecraft || [];

                    // 4. 检测每个版本的文件是否存在
                    const availableVersions = [];
                    for (const mcVer of minecraftVersions) {
                        const fileName = fileMap[mcVer];
                        if (fileName) {
                            const fullUrl = DOWNLOAD_BASE + fileName + '.zip';
                            const exists = await fileExists(fullUrl);
                            if (exists) {
                                availableVersions.push({
                                    version: mcVer,
                                    file: fileName + '.zip'
                                });
                            }
                        }
                    }

                    // 5. 按版本号从高到低排序
                    availableVersions.sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }));

                    // 6. 更新 UI
                    projectName.textContent = name;
                    versionBadge.textContent = versionType;
                    projectNote.textContent = note;
                    verlevelTag.textContent = `等级 ${verlevel}`;

                    if (availableVersions.length === 0) {
                        // 没有任何文件可下载 → 显示空状态
                        normalContent.style.display = 'none';
                        emptyContent.style.display = 'block';
                        projectCard.classList.add('visible');
                        return;
                    }

                    // 有文件可下载 → 显示正常状态
                    normalContent.style.display = 'block';
                    emptyContent.style.display = 'none';
                    projectCard.classList.add('visible');

                    // 渲染版本列表
                    versionList.innerHTML = '';
                    availableVersions.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'version-item';

                        const left = document.createElement('div');
                        left.className = 'version-left';
                        left.innerHTML = `
                            <span class="version-icon">
                                <img src="${ICON_VERSION}" alt="Version" />
                            </span>
                            <span class="version-number">${item.version}</span>
                        `;

                        const dlBtn = document.createElement('button');
                        dlBtn.className = 'version-download';
                        dlBtn.setAttribute('aria-label', `Download version ${item.version}`);
                        dlBtn.innerHTML = `<img src="${ICON_DOWNLOAD}" alt="Download" />`;
                        dlBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const url = DOWNLOAD_BASE + item.file;
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = item.file;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        });

                        div.appendChild(left);
                        div.appendChild(dlBtn);
                        versionList.appendChild(div);
                    });

                    // 模态框事件绑定（只绑定一次）
                    if (!window._modalBound) {
                        openModalBtn.addEventListener('click', openModal);
                        closeModalBtn.addEventListener('click', closeModal);
                        modalOverlay.addEventListener('click', function(e) {
                            if (e.target === modalOverlay) closeModal();
                        });
                        document.addEventListener('keydown', function(e) {
                            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
                        });
                        window._modalBound = true;
                    }

                } catch (error) {
                    // 任何其他错误 → 忽略，不显示任何内容
                    console.debug('Page initialized with no data pack.');
                }
            }

            // ========== 启动 ==========
            init();
        })();
    </script>
</body>
</html>
