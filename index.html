<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fire data pack</title>
    <link rel="icon" type="image/svg+xml" href="assets/main/textures/favicon.svg" />

    <style>
        /* 样式与之前完全一致，因篇幅省略，实际使用请复制完整样式 */
        /* 我已在之前的回答中给出完整样式，此处不再重复 */
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">
            <img src="assets/main/textures/fire.svg" alt="Fire" class="title-icon" />
            <span>fire data pack</span>
        </h1>
        <div class="title-underline"></div>

        <div class="project-card" id="projectCard">
            <div id="normalContent">
                <div class="project-header">
                    <div class="project-icon">
                        <img src="assets/main/textures/package.svg" alt="Package" />
                    </div>
                    <div class="project-name">
                        <span id="projectName">neovillage.zip</span>
                        <span class="badge" id="versionBadge">Alpha</span>
                    </div>
                </div>
                <div class="project-note">
                    <span class="note-icon">
                        <img src="assets/main/textures/pin.svg" alt="Pin" />
                    </span>
                    <span class="note-text" id="projectNote">bug fix</span>
                    <span class="version-tag" id="verlevelTag">等级 3</span>
                </div>
                <div class="divider"></div>
                <div class="download-area">
                    <div class="download-info">
                        <span class="info-icon">
                            <img src="assets/main/textures/clip.svg" alt="Clip" />
                        </span>
                        <span>Data Pack</span>
                        <span class="file-size">~1.2 MB</span>
                    </div>
                    <button class="download-btn" id="openModalBtn">
                        <span class="btn-icon">
                            <img src="assets/main/textures/download.svg" alt="Download" />
                        </span>
                        Download
                    </button>
                </div>
            </div>
            <div id="emptyContent" style="display:none;">
                <div class="empty-state">
                    <span class="empty-icon">📂</span>
                    <span class="empty-text">Looks like the files aren't installed yet...</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>✦  Made with 🔥  ·  MC Data Pack  ✦</span>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="versionModal">
        <div class="modal-box">
            <div class="modal-title"><span style="color:#ff7a00;">📦</span> Select Version</div>
            <div class="version-list" id="versionList"></div>
            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== 唯一约定路径 =====
            const JSON_PATH = 'data/main/file/neovillage.json';
            const DOWNLOAD_BASE = 'assets/main/download/';
            const ICON_VERSION = 'assets/main/textures/version.svg';
            const ICON_DOWNLOAD = 'assets/main/textures/download.svg';

            // DOM 引用
            const projectCard = document.getElementById('projectCard');
            const normalContent = document.getElementById('normalContent');
            const emptyContent = document.getElementById('emptyContent');
            const projectName = document.getElementById('projectName');
            const versionBadge = document.getElementById('versionBadge');
            const projectNote = document.getElementById('projectNote');
            const verlevelTag = document.getElementById('verlevelTag');
            const versionList = document.getElementById('versionList');
            const openModalBtn = document.getElementById('openModalBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalOverlay = document.getElementById('versionModal');

            function getVersionType(v) {
                const map = { 1:'Alpha', 2:'Beta', 3:'Stable Beta', 4:'Official' };
                return map[v] || 'Unknown';
            }

            function fileExists(url) {
                return fetch(url, { method: 'HEAD' }).then(r => r.ok).catch(() => false);
            }

            function openModal() { modalOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
            function closeModal() { modalOverlay.classList.remove('active'); document.body.style.overflow = ''; }

            async function init() {
                try {
                    const res = await fetch(JSON_PATH);
                    if (!res.ok) return; // 静默失败，页面保持隐藏
                    const data = await res.json();

                    if (data.check_code !== 1 && data.check_code !== 48) return;

                    const name = data.name || 'neovillage.zip';
                    const versionType = getVersionType(data.version);
                    const note = data.note || '';
                    const verlevel = data.verlevel || 0;
                    const fileMap = data.file || {};
                    const minecraftVersions = data.minecraft || [];

                    // 检测文件
                    const available = [];
                    for (const mcVer of minecraftVersions) {
                        const fileName = fileMap[mcVer];
                        if (fileName) {
                            const fullUrl = DOWNLOAD_BASE + fileName + '.zip';
                            if (await fileExists(fullUrl)) {
                                available.push({ version: mcVer, file: fileName + '.zip' });
                            }
                        }
                    }

                    available.sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }));

                    // 更新界面
                    projectName.textContent = name;
                    versionBadge.textContent = versionType;
                    projectNote.textContent = note;
                    verlevelTag.textContent = `等级 ${verlevel}`;

                    if (available.length === 0) {
                        normalContent.style.display = 'none';
                        emptyContent.style.display = 'block';
                        projectCard.classList.add('visible');
                        return;
                    }

                    normalContent.style.display = 'block';
                    emptyContent.style.display = 'none';
                    projectCard.classList.add('visible');

                    versionList.innerHTML = '';
                    available.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'version-item';
                        div.innerHTML = `
                            <div class="version-left">
                                <span class="version-icon"><img src="${ICON_VERSION}" alt="Version" /></span>
                                <span class="version-number">${item.version}</span>
                            </div>
                            <button class="version-download" aria-label="Download version ${item.version}">
                                <img src="${ICON_DOWNLOAD}" alt="Download" />
                            </button>
                        `;
                        const dlBtn = div.querySelector('.version-download');
                        dlBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const a = document.createElement('a');
                            a.href = DOWNLOAD_BASE + item.file;
                            a.download = item.file;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        });
                        versionList.appendChild(div);
                    });

                    // 模态框事件（只绑定一次）
                    if (!window._modalBound) {
                        openModalBtn.addEventListener('click', openModal);
                        closeModalBtn.addEventListener('click', closeModal);
                        modalOverlay.addEventListener('click', function(e) {
                            if (e.target === modalOverlay) closeModal();
                        });
                        document.addEventListener('keydown', function(e) {
                            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
                        });
                        window._modalBound = true;
                    }

                } catch (e) {
                    // 任何错误都不显示页面内容
                }
            }

            init();
        })();
    </script>
</body>
</html>
