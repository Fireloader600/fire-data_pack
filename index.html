<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fire data pack</title>

    <!-- 网站图标 (外部 SVG) -->
    <link rel="icon" type="image/svg+xml" href="assets/main/textures/favicon.svg" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0806;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(180, 60, 0, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(220, 80, 0, 0.15) 0%, transparent 50%);
            padding: 20px;
        }

        .container {
            max-width: 620px;
            width: 100%;
            animation: fadeUp 0.8s ease-out both;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .main-title {
            text-align: center;
            font-size: clamp(2.8rem, 10vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #ff9a3c, #ff5e00, #ff2a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .title-icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            flex-shrink: 0;
        }

        .title-underline {
            width: 70px;
            height: 3px;
            margin: 12px auto 30px auto;
            background: linear-gradient(90deg, transparent, #ff6a00, transparent);
            border-radius: 4px;
            opacity: 0.6;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 140, 40, 0.15);
            border-radius: 24px;
            padding: 30px 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .project-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .project-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: rgba(255, 120, 20, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 140, 40, 0.1);
            padding: 8px;
        }

        .project-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .project-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0e6d8;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 600;
            background: rgba(255, 140, 40, 0.15);
            color: #ffb074;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 140, 40, 0.1);
            text-transform: uppercase;
        }

        .project-note {
            margin-top: 6px;
            font-size: 0.95rem;
            color: #b8a89a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .note-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .note-text {
            background: rgba(255, 200, 100, 0.05);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 200, 100, 0.06);
            font-size: 0.85rem;
            color: #d4c0b0;
        }

        .divider {
            margin: 18px 0 22px 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 40, 0.12), transparent);
        }

        .download-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .download-info {
            font-size: 0.85rem;
            color: #8a7a6a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-info .info-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .download-info .info-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .file-size {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #9a8a7a;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff7a2a, #f05000);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(255, 80, 0, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }

        .download-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 40px rgba(255, 80, 0, 0.5);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .download-btn .btn-icon {
            width: 1.2rem;
            height: 1.2rem;
            display: inline-block;
        }

        .download-btn .btn-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 200, 160, 0.08);
            letter-spacing: 0.06em;
        }

        @media (max-width: 500px) {
            .project-card { padding: 20px 18px; }
            .project-name { font-size: 1.25rem; }
            .download-area { flex-direction: column; align-items: stretch; }
            .download-btn { width: 100%; justify-content: center; }
            .download-info { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">
            <img src="assets/main/textures/fire.svg" alt="Fire" class="title-icon" />
            <span>fire data pack</span>
        </h1>
        <div class="title-underline"></div>

        <div class="project-card">
            <div class="project-header">
                <div class="project-icon">
                    <img src="assets/main/textures/package.svg" alt="Package" />
                </div>
                <div class="project-name">
                    neovillage.zip
                    <span class="badge">Alpha 3</span>
                </div>
            </div>
            <div class="project-note">
                <span class="note-icon">
                    <img src="assets/main/textures/pin.svg" alt="Pin" />
                </span>
                <span class="note-text">Bug fix</span>
            </div>

            <div class="divider"></div>

            <div class="download-area">
                <div class="download-info">
                    <span class="info-icon">
                        <img src="assets/main/textures/clip.svg" alt="Clip" />
                    </span>
                    <span>Data Pack</span>
                    <span class="file-size">~1.2 MB</span>
                </div>
                <a href="assets/main/download_src/neovillage.zip" download="neovillage.zip" class="download-btn">
                    <span class="btn-icon">
                        <img src="assets/main/textures/download.svg" alt="Download" />
                    </span>
                    Download
                </a>
            </div>
        </div>

        <div class="footer">
            <span>✦  Made with 🔥  ·  MC Data Pack  ✦</span>
        </div>
    </div>
</body>
</html>
