<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fire data pack</title>
    <link rel="icon" type="image/svg+xml" href="assets/main/textures/favicon.svg" />

    <style>
        /* ===== 全局重置 & 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0806;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(180, 60, 0, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(220, 80, 0, 0.15) 0%, transparent 50%);
            padding: 20px;
        }

        .container {
            max-width: 620px;
            width: 100%;
            animation: fadeUp 0.8s ease-out both;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 标题 ===== */
        .main-title {
            text-align: center;
            font-size: clamp(2.8rem, 10vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #ff9a3c, #ff5e00, #ff2a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .title-icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            flex-shrink: 0;
        }

        .title-underline {
            width: 70px;
            height: 3px;
            margin: 12px auto 30px auto;
            background: linear-gradient(90deg, transparent, #ff6a00, transparent);
            border-radius: 4px;
            opacity: 0.6;
        }

        /* ===== 项目卡片 ===== */
        .project-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 140, 40, 0.15);
            border-radius: 24px;
            padding: 30px 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .project-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .project-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: rgba(255, 120, 20, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 140, 40, 0.1);
            padding: 8px;
        }

        .project-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .project-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0e6d8;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 600;
            background: rgba(255, 140, 40, 0.15);
            color: #ffb074;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 140, 40, 0.1);
            text-transform: uppercase;
        }

        .project-note {
            margin-top: 6px;
            font-size: 0.95rem;
            color: #b8a89a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .note-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .note-text {
            background: rgba(255, 200, 100, 0.05);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 200, 100, 0.06);
            font-size: 0.85rem;
            color: #d4c0b0;
        }

        .divider {
            margin: 18px 0 22px 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 40, 0.12), transparent);
        }

        /* ===== 下载按钮（触发弹窗） ===== */
        .download-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .download-info {
            font-size: 0.85rem;
            color: #8a7a6a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-info .info-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }

        .download-info .info-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .file-size {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #9a8a7a;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff7a2a, #f05000);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(255, 80, 0, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }

        .download-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 40px rgba(255, 80, 0, 0.5);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .download-btn .btn-icon {
            width: 1.2rem;
            height: 1.2rem;
            display: inline-block;
        }

        .download-btn .btn-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== 版本选择模态框 ===== */
        .modal-overlay {
            display: none; /* 默认隐藏 */
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.25s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .modal-box {
            background: rgba(20, 14, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 140, 40, 0.2);
            border-radius: 28px;
            padding: 32px 30px 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f0e6d8;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }

        .modal-title .title-emoji {
            color: #ff7a00;
            margin-right: 6px;
        }

        .version-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .version-list::-webkit-scrollbar {
            width: 4px;
        }

        .version-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .version-list::-webkit-scrollbar-thumb {
            background: rgba(255, 140, 40, 0.3);
            border-radius: 10px;
        }

        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s, border-color 0.2s;
        }

        .version-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 140, 40, 0.15);
        }

        .version-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .version-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .version-number {
            font-size: 1rem;
            font-weight: 600;
            color: #e8ddd0;
            letter-spacing: 0.01em;
        }

        .version-download {
            width: 32px;
            height: 32px;
            padding: 4px;
            border-radius: 50%;
            background: rgba(255, 120, 20, 0.12);
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .version-download:hover {
            background: rgba(255, 120, 20, 0.25);
            transform: scale(1.08);
        }

        .version-download:active {
            transform: scale(0.92);
        }

        .version-download img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .modal-close {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #b8a89a;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f0e6d8;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 200, 160, 0.08);
            letter-spacing: 0.06em;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .project-card { padding: 20px 18px; }
            .project-name { font-size: 1.25rem; }
            .download-area { flex-direction: column; align-items: stretch; }
            .download-btn { width: 100%; justify-content: center; }
            .download-info { justify-content: center; }
            .modal-box { padding: 24px 18px; }
            .version-item { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <h1 class="main-title">
            <img src="assets/main/textures/fire.svg" alt="Fire" class="title-icon" />
            <span>fire data pack</span>
        </h1>
        <div class="title-underline"></div>

        <!-- 项目卡片 -->
        <div class="project-card">
            <div class="project-header">
                <div class="project-icon">
                    <img src="assets/main/textures/package.svg" alt="Package" />
                </div>
                <div class="project-name">
                    neovillage.zip
                    <span class="badge">Alpha 3</span>
                </div>
            </div>
            <div class="project-note">
                <span class="note-icon">
                    <img src="assets/main/textures/pin.svg" alt="Pin" />
                </span>
                <span class="note-text">Bug fix</span>
            </div>

            <div class="divider"></div>

            <!-- 下载区域（按钮触发弹窗） -->
            <div class="download-area">
                <div class="download-info">
                    <span class="info-icon">
                        <img src="assets/main/textures/clip.svg" alt="Clip" />
                    </span>
                    <span>Data Pack</span>
                    <span class="file-size">~1.2 MB</span>
                </div>
                <button class="download-btn" id="openModalBtn">
                    <span class="btn-icon">
                        <img src="assets/main/textures/download.svg" alt="Download" />
                    </span>
                    Download
                </button>
            </div>
        </div>

        <div class="footer">
            <span>✦  Made with 🔥  ·  MC Data Pack  ✦</span>
        </div>
    </div>

    <!-- ===== 版本选择模态框 ===== -->
    <div class="modal-overlay" id="versionModal">
        <div class="modal-box">
            <div class="modal-title">
                <span class="title-emoji">📦</span> Select Version
            </div>
            <div class="version-list" id="versionList">
                <!-- 由 JavaScript 动态生成 -->
            </div>
            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 版本数据 ----------
            // 按版本号从高到低排列（版本号越高，排位越高）
            const versions = [
                { version: '1.21.11', file: 'neovillage-1.21.11.zip' },
                { version: '1.20.1',  file: 'neovillage-1.20.1.zip' }
            ];

            // 图标路径（复用已有的 SVG）
            const ICON_VERSION = 'assets/main/textures/version.svg';
            const ICON_DOWNLOAD = 'assets/main/textures/download.svg';

            // ---------- DOM 引用 ----------
            const modalOverlay = document.getElementById('versionModal');
            const versionList = document.getElementById('versionList');
            const openBtn = document.getElementById('openModalBtn');
            const closeBtn = document.getElementById('closeModalBtn');

            // ---------- 渲染版本列表 ----------
            function renderVersions() {
                versionList.innerHTML = '';
                versions.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'version-item';

                    // 左：版本图标 + 版本号
                    const left = document.createElement('div');
                    left.className = 'version-left';
                    left.innerHTML = `
                        <span class="version-icon">
                            <img src="${ICON_VERSION}" alt="Version" />
                        </span>
                        <span class="version-number">${item.version}</span>
                    `;

                    // 右：下载按钮
                    const dlBtn = document.createElement('button');
                    dlBtn.className = 'version-download';
                    dlBtn.setAttribute('aria-label', `Download version ${item.version}`);
                    dlBtn.innerHTML = `<img src="${ICON_DOWNLOAD}" alt="Download" />`;
                    dlBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        // 构造下载 URL（假设所有版本文件放在 assets/main/download_src/ 下）
                        const url = `assets/main/download_src/${item.file}`;
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = item.file;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        // 下载后不关闭弹窗，让用户自己关闭
                    });

                    div.appendChild(left);
                    div.appendChild(dlBtn);
                    versionList.appendChild(div);
                });
            }

            // ---------- 模态框控制 ----------
            function openModal() {
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden'; // 防止滚动
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // 点击遮罩关闭
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            // 按钮事件
            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);

            // 键盘 ESC 关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            // ---------- 启动 ----------
            renderVersions();

            // 控制台提示
            console.log('🔥 fire data pack — 版本选择已加载');
            console.log('📦 版本列表:', versions.map(v => v.version).join(', '));
        })();
    </script>

</body>
</html>
