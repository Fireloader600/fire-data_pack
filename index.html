<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fire data pack</title>
    <link rel="icon" type="image/svg+xml" href="assets/main/textures/favicon.svg" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0806;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(180, 60, 0, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(220, 80, 0, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(140, 40, 0, 0.20) 0%, transparent 40%);
            background-attachment: fixed;
            padding: 40px 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            animation: fadeUp 0.8s ease-out both;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .main-title {
            text-align: center;
            font-size: clamp(2.8rem, 10vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #ff9a3c, #ff5e00, #ff2a00, #ff7a00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: shimmerTitle 5s ease-in-out infinite alternate;
        }
        @keyframes shimmerTitle {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .title-icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            flex-shrink: 0;
            -webkit-text-fill-color: initial;
        }
        .title-underline {
            width: 70px;
            height: 3px;
            margin: 12px auto 30px auto;
            background: linear-gradient(90deg, transparent, #ff6a00, transparent);
            border-radius: 4px;
            opacity: 0.6;
        }
        .packs-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .project-card {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 140, 40, 0.15);
            border-radius: 24px;
            padding: 30px 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .project-card.visible {
            display: block;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 100, 0, 0.06);
            border-color: rgba(255, 150, 50, 0.30);
        }
        .project-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .project-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: rgba(255, 120, 20, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 140, 40, 0.1);
            padding: 8px;
        }
        .project-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .project-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0e6d8;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .badge {
            font-size: 0.65rem;
            font-weight: 600;
            background: rgba(255, 140, 40, 0.15);
            color: #ffb074;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 140, 40, 0.1);
            text-transform: uppercase;
        }
        .project-note {
            margin-top: 6px;
            font-size: 0.95rem;
            color: #b8a89a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .note-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }
        .note-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .note-text {
            background: rgba(255, 200, 100, 0.05);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 200, 100, 0.06);
            font-size: 0.85rem;
            color: #d4c0b0;
        }
        .version-tag {
            background: rgba(255, 100, 50, 0.12);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #ffb074;
            border: 1px solid rgba(255, 100, 50, 0.1);
        }
        .experimental-badge {
            display: inline-block;
            background: rgba(255, 40, 40, 0.15);
            color: #ff6b6b;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 40, 40, 0.25);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .experimental-badge.hidden {
            display: none;
        }
        .divider {
            margin: 18px 0 22px 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 40, 0.12), transparent);
        }
        .download-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .download-info {
            font-size: 0.85rem;
            color: #8a7a6a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .download-info .info-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
        }
        .download-info .info-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .file-size {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #9a8a7a;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff7a2a, #f05000);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(255, 80, 0, 0.35);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, background 0.3s ease;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .download-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 40px rgba(255, 80, 0, 0.5);
            background: linear-gradient(135deg, #ff8a3a, #f05a00);
        }
        .download-btn:active {
            transform: scale(0.95);
        }
        .download-btn .btn-icon {
            width: 1.2rem;
            height: 1.2rem;
            display: inline-block;
        }
        .download-btn .btn-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.25s ease-out;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .modal-box {
            background: rgba(20, 14, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 140, 40, 0.2);
            border-radius: 28px;
            padding: 32px 30px 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f0e6d8;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-title img {
            width: 1.2em;
            height: 1.2em;
            display: inline-block;
        }
        .version-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .version-list::-webkit-scrollbar {
            width: 4px;
        }
        .version-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .version-list::-webkit-scrollbar-thumb {
            background: rgba(255, 140, 40, 0.3);
            border-radius: 10px;
        }
        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s, border-color 0.2s;
        }
        .version-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 140, 40, 0.15);
        }
        .version-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .version-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .version-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .version-number {
            font-size: 1rem;
            font-weight: 600;
            color: #e8ddd0;
            letter-spacing: 0.01em;
        }
        .version-download {
            width: 32px;
            height: 32px;
            padding: 4px;
            border-radius: 50%;
            background: rgba(255, 120, 20, 0.12);
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .version-download:hover {
            background: rgba(255, 120, 20, 0.25);
            transform: scale(1.08);
        }
        .version-download:active {
            transform: scale(0.92);
        }
        .version-download img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .modal-close {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #b8a89a;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f0e6d8;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 200, 160, 0.08);
            letter-spacing: 0.06em;
        }
        @media (max-width: 500px) {
            .project-card { padding: 20px 18px; }
            .project-name { font-size: 1.25rem; }
            .download-area { flex-direction: column; align-items: stretch; }
            .download-btn { width: 100%; justify-content: center; }
            .download-info { justify-content: center; }
            .modal-box { padding: 24px 18px; }
            .version-item { padding: 10px 12px; }
            .project-note { gap: 6px; }
            .experimental-badge { font-size: 0.7rem; padding: 1px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">
            <img src="assets/main/textures/fire.svg" alt="Fire" class="title-icon" />
            <span>fire data pack</span>
        </h1>
        <div class="title-underline"></div>
        <div class="packs-grid" id="packsGrid"></div>
        <div class="footer">
            <span>✦  Made with 🔥  ·  MC Data Pack  ✦</span>
        </div>
    </div>

    <div class="modal-overlay" id="versionModal">
        <div class="modal-box">
            <div class="modal-title">
                <img src="assets/main/textures/package.svg" alt="Package" />
                Select Version
            </div>
            <div class="version-list" id="versionList"></div>
            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const PACK_JSON_FILES = [
                'neovillage.json',
                'structure_optimization.json'
            ];

            const JSON_BASE = 'data/main/file/';
            const DOWNLOAD_BASE = 'assets/main/download_src/';
            const ICON_VERSION = 'assets/main/textures/version.svg';
            const ICON_DOWNLOAD = 'assets/main/textures/download.svg';
            const ICON_PACKAGE = 'assets/main/textures/package.svg';
            const ICON_PIN = 'assets/main/textures/pin.svg';
            const ICON_CLIP = 'assets/main/textures/clip.svg';

            const packsGrid = document.getElementById('packsGrid');
            const modalOverlay = document.getElementById('versionModal');
            const versionList = document.getElementById('versionList');
            const closeModalBtn = document.getElementById('closeModalBtn');

            function getVersionType(v) {
                const map = { 1: 'Alpha', 2: 'Beta', 3: 'Stable Beta', 4: 'Official' };
                return map[v] || 'Unknown';
            }

            function openModal(packData) {
                versionList.innerHTML = '';
                const availableVersions = packData._availableVersions || [];
                if (availableVersions.length === 0) {
                    versionList.innerHTML = `<div style="text-align:center;color:#8a7a6a;padding:20px 0;">No versions available</div>`;
                } else {
                    availableVersions.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'version-item';
                        div.innerHTML = `
                            <div class="version-left">
                                <span class="version-icon"><img src="${ICON_VERSION}" alt="Version" /></span>
                                <span class="version-number">${item.version}</span>
                            </div>
                            <button class="version-download" aria-label="Download version ${item.version}">
                                <img src="${ICON_DOWNLOAD}" alt="Download" />
                            </button>
                        `;
                        const dlBtn = div.querySelector('.version-download');
                        dlBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const a = document.createElement('a');
                            a.href = DOWNLOAD_BASE + item.file;
                            a.download = item.file;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        });
                        versionList.appendChild(div);
                    });
                }
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            if (!window._modalBound) {
                closeModalBtn.addEventListener('click', closeModal);
                modalOverlay.addEventListener('click', function(e) {
                    if (e.target === modalOverlay) closeModal();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
                });
                window._modalBound = true;
            }

            async function loadPack(jsonFileName) {
                try {
                    const res = await fetch(JSON_BASE + jsonFileName);
                    if (!res.ok) return null;
                    const data = await res.json();
                    if (data.check_code !== 1 && data.check_code !== 48) return null;

                    const name = data.name || 'unknown.zip';
                    const versionType = getVersionType(data.version);
                    const note = data.note || '';
                    const verlevel = data.verlevel;
                    const fileMap = data.file || {};
                    const minecraftVersions = data.minecraft || [];
                    const isExperimental = data.experimental === true;

                    const available = [];
                    for (const mcVer of minecraftVersions) {
                        const fileName = fileMap[mcVer];
                        if (fileName) available.push({ version: mcVer, file: fileName + '.zip' });
                    }
                    available.sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }));

                    return { name, versionType, note, verlevel, isExperimental, available };
                } catch (e) {
                    return null;
                }
            }

            async function loadAllPacks() {
                for (const fileName of PACK_JSON_FILES) {
                    const pack = await loadPack(fileName);
                    if (!pack || pack.available.length === 0) continue;

                    const card = document.createElement('div');
                    card.className = 'project-card';
                    const expClass = pack.isExperimental ? '' : 'hidden';
                    card.innerHTML = `
                        <div class="project-header">
                            <div class="project-icon"><img src="${ICON_PACKAGE}" alt="Package" /></div>
                            <div class="project-name">
                                <span>${pack.name}</span>
                                <span class="badge">${pack.versionType}</span>
                            </div>
                        </div>
                        <div class="project-note">
                            <span class="note-icon"><img src="${ICON_PIN}" alt="Pin" /></span>
                            <span class="note-text">${pack.note}</span>
                            <span class="version-tag">Version ${pack.verlevel}</span>
                            <span class="experimental-badge ${expClass}">Experimental</span>
                        </div>
                        <div class="divider"></div>
                        <div class="download-area">
                            <div class="download-info">
                                <span class="info-icon"><img src="${ICON_CLIP}" alt="Clip" /></span>
                                <span>Data Pack</span>
                                <span class="file-size">~1.2 MB</span>
                            </div>
                            <button class="download-btn" data-pack-name="${pack.name}">
                                <span class="btn-icon"><img src="${ICON_DOWNLOAD}" alt="Download" /></span>
                                Download
                            </button>
                        </div>
                    `;
                    const btn = card.querySelector('.download-btn');
                    pack._availableVersions = pack.available;
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        openModal(pack);
                    });
                    card.classList.add('visible');
                    packsGrid.appendChild(card);
                }
                // 如果没有任何可用数据包，packsGrid 将保持为空（无任何文本）
            }

            loadAllPacks();
        })();
    </script>
</body>
</html>
